<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ef">
  <meta name="color-scheme" content="light dark">
  <title>Nexora</title>
  <meta name="description" content="Finanças da casa e compras em família.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexora">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/telas.css">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('nx.tema')||'"auto"');var d=t==='escuro'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}})();</script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Pular para o conteúdo</a>
  <div id="root">
  <div id="auth" class="auth" hidden></div>
  <div id="app" class="app" hidden>
    <aside class="side" aria-label="Navegação principal">
      <div class="side-brand"><span class="logo" aria-hidden="true"><span class="logo-dot"></span></span><span class="side-name">nexora</span></div>
      <div id="side-space"></div>
      <nav id="side-nav" class="side-nav"></nav>
      <div id="side-foot" class="side-foot"></div>
    </aside>
    <div class="main">
      <header class="top" id="top">
        <button class="icon-btn top-back" id="top-back" type="button" aria-label="Voltar" hidden></button>
        <div class="top-titles"><h1 class="top-title" id="top-title">Nexora</h1><p class="top-sub" id="top-sub" hidden></p></div>
        <div class="top-actions" id="top-actions"></div>
        <div id="top-space"></div>
      </header>
      <div id="net" class="net" role="status" hidden></div>
      <div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-spin"></span></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="tabs" id="tabs" aria-label="Navegação"></nav>
    <button class="fab" id="fab" type="button" hidden></button>
  </div>
  </div>
  <div id="boot" class="boot" aria-busy="true" aria-label="Carregando">
    <span class="logo logo--lg" aria-hidden="true"><span class="logo-dot"></span></span>
  </div>
  <noscript><p class="noscript">Ative o JavaScript para usar o Nexora.</p></noscript>
  <div id="sheets"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
